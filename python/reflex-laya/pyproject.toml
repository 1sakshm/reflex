[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-laya"
version = "0.1.0"
description = "Laya full-model sidecar for Reflex (tier 6): scores candidate agent actions in one forward pass."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Saksham Sharma" }]
keywords = ["ai", "agents", "llm", "routing", "system-1", "reflex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1sakshm/reflex"
Issues = "https://github.com/1sakshm/reflex/issues"

[project.optional-dependencies]
laya = ["laya>=0.3.28,<0.4"]

[project.scripts]
reflex-laya = "reflex_laya.server:main"

[tool.setuptools]
packages = ["reflex_laya"]
